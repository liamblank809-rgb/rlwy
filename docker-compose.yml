services:
  founder-hermes:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HERMES_HOME: /opt/data
      PORT: 8642
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${API_SERVER_KEY:?set API_SERVER_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INSTALL_FOUNDER_SKILLS: ${INSTALL_FOUNDER_SKILLS:-true}
      FOUNDER_SKILLS: ${FOUNDER_SKILLS:-github docker linux research browser playwright product strategy marketing sales finance}
    volumes:
      - founder-data:/opt/data
    ports:
      - "8642:8642"

  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?set PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
    volumes:
      - paperclip-data:/paperclip
    ports:
      - "3100:3100"

volumes:
  founder-data:
  paperclip-data:
